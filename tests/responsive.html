<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Radar responsive layout check</title>
    <style>
      body {
        margin: 0;
        background: #e5e7eb;
        font: 14px system-ui;
      }
      header {
        padding: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      button,
      select {
        padding: 9px;
        font: inherit;
      }
      main {
        overflow: auto;
        padding: 12px;
      }
      iframe {
        display: block;
        width: 390px;
        height: 900px;
        border: 1px solid #bbb;
        background: white;
        margin: 0 auto;
      }
      output {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <label
        >頁面
        <select id="page">
          <option value="index">首頁</option>
          <option value="upcoming">即將上市</option>
          <option value="released">近期上市</option>
          <option value="saved">收藏</option>
          <option value="date">指定日期</option>
        </select></label
      ><button data-width="320">320px</button
      ><button data-width="390">390px</button
      ><button data-width="768">768px</button
      ><button data-width="1280">1280px</button
      ><output id="size">390 × 900</output>
    </header>
    <main>
      <iframe id="preview" title="網站響應式預覽" src="../index.html"></iframe>
    </main>
    <script>
      const frame = document.getElementById("preview");
      document.querySelectorAll("[data-width]").forEach((button) =>
        button.addEventListener("click", () => {
          frame.style.width = button.dataset.width + "px";
          document.getElementById("size").textContent =
            button.dataset.width + " × 900";
          frame.contentWindow.location.reload();
        }),
      );
      document.getElementById("page").addEventListener("change", (event) => {
        frame.src =
          "../" +
          event.target.value +
          ".html" +
          (event.target.value === "date" ? "?date=2026-09-29" : "");
      });
    </script>
  </body>
</html>
