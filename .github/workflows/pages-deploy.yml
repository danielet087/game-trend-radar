name: Deploy site to Pages
run-name: "Deploy site to Pages | ${{ inputs.verify_live && 'verify live site' || 'deploy' }}${{ inputs.live_data && ' | live data drill' || '' }} | slot=${{ inputs.target_slot || 'manual' }} | source=${{ inputs.trigger_source || github.event_name }}"

# Publishes the committed tree of main exactly as the branch deploy does
# (git archive of one commit). Deploying through Actions lets a later step add
# the high-churn Twitch views from the database instead of Git, so this
# repository stops growing by tens of MB a day.
#
# Until the repository's Pages source is set to "GitHub Actions", pushes stop
# after a few seconds and a manual run only builds the artifact; deploy-pages
# runs only once Actions is the source. verify_live builds the commit the live
# site was built from and compares every file with what Pages serves now.
#
# Data commits (only data/**) do not deploy one by one: every deploy changes
# every file's ETag, so browsers download all data again. The Cloudflare
# scheduler dispatches one deploy each hour at :30 that publishes everything
# committed since, so data reaches the site within about an hour. Any push
# that changes something outside data/** (code, pages, workflows) still
# deploys at once; frontend-build.yml dispatches a deploy after it commits a
# new static build.
#
# Each deploy records the sha256 of every data file it publishes in
# site-data.json. When a deploy cannot read the database, the data steps put
# back exactly the live site's data, verified against that record, and the new
# code still deploys (scripts/live_site_data.py). live_data runs that path on
# purpose as a drill.
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  workflow_dispatch:
    inputs:
      verify_live:
        description: Compare the live site with the tree of the commit it was built from (no deploy)
        required: false
        type: boolean
        default: false
      live_data:
        description: Drill - use the live site's data instead of reading the database
        required: false
        type: boolean
        default: false
      target_slot:
        description: External scheduler slot identifier (leave empty for a manual run)
        required: false
        type: string
        default: ''
      trigger_source:
        description: Trigger source for run identification
        required: false
        type: string
        default: manual

permissions:
  contents: read

env:
  # auto: until data/publication/twitch_views.json moves the Twitch views to the
  # database, deploy Git's copy and compare the database copy with it; after the
  # move, deploy the database copy (danielet087/game-trend-radar@twitch-views).
  # verify or overlay force one behaviour.
  SITE_TWITCH_VIEWS: auto
  # auto: data/publication/data_home.json in the database decides. "site":
  # "database" deploys the database's newest data (the plan's phase 1 switch,
  # set only with the owner's approval); otherwise, or without the flag, compare
  # as verify does. verify: compare the data Git publishes with the database
  # version its commit was projected from and only report differences (the Git
  # copy is deployed). overlay: always deploy the database's newest data.
  SITE_DATA: auto

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      build: ${{ steps.source.outputs.build }}
      deploy: ${{ steps.source.outputs.deploy }}
    steps:
      - name: Check the Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          VERIFY: ${{ inputs.verify_live && 'true' || 'false' }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          echo "Pages source: $build_type"
          build=false; deploy=false
          if [ "$build_type" = workflow ] || [ "$EVENT" = workflow_dispatch ]; then build=true; fi
          if [ "$build_type" = workflow ] && [ "$VERIFY" != true ]; then deploy=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    if: needs.source.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
      deployments: read
    steps:
      - name: Choose the commit to publish
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY: ${{ inputs.verify_live && 'true' || 'false' }}
        run: |
          # The live site's commit: the newest github-pages deployment that finished.
          served_commit() {
            for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=10" --jq '.[].id'); do
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state')
              if [ "$state" = success ]; then gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha; return; fi
            done
          }
          if [ "$VERIFY" = true ]; then
            commit=$(served_commit)
          else
            commit=$GITHUB_SHA
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::No commit to publish"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Publishing $commit"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.commit }}
          persist-credentials: false
      - name: Assemble the committed tree
        env:
          COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          mkdir _site
          git archive --format=tar "$COMMIT" | tar -x -C _site
          expected=$(git ls-tree -r --name-only "$COMMIT" | wc -l)
          actual=$(find _site -type f | wc -l)
          bytes=$(du -sb _site | cut -f1)
          echo "files=$actual (tree $expected) bytes=$bytes"
          [ "$actual" -eq "$expected" ] || { echo "::error::Assembled tree differs from the commit"; exit 1; }
          [ -f _site/index.html ] || { echo "::error::index.html missing"; exit 1; }
          # Published Pages sites may be no larger than 1 GB.
          [ "$bytes" -lt 1000000000 ] || { echo "::error::Site is larger than 1 GB"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Compare or replace the site data with the database copy
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.target.outputs.commit }}
          VERIFY: ${{ inputs.verify_live && 'true' || 'false' }}
          RADAR_DEPLOY_LIVE_DATA: ${{ inputs.live_data && '1' || '0' }}
        run: |
          # A commit published by verify_live may predate this step.
          [ -f scripts/site_data.py ] || { echo "No site data step in this commit."; exit 0; }
          python -m pip install --disable-pip-version-check -q -r requirements-core.txt
          mode=$SITE_DATA
          if [ "$VERIFY" = true ]; then
            # Rebuild what is live: the database version its site-build.json
            # records, or the Git copy when the live site was built from Git.
            record=$(curl -fsS "https://danielet087.github.io/game-trend-radar/site-build.json?verify=$GITHUB_RUN_ID" || true)
            digest=$(printf '%s' "$record" | python3 -c 'import json, sys
          try:
              print(json.loads(sys.stdin.read()).get("manifest_digest", ""))
          except (ValueError, AttributeError):
              pass')
            if [ -n "$digest" ]; then
              python scripts/site_data.py _site --mode overlay --revision "$digest"
              exit 0
            fi
            mode=verify
          fi
          if [ "$mode" = overlay ]; then
            python scripts/site_data.py _site --mode overlay
          else
            # The newest commit that changed data/ is the one projected from a database version.
            data_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$COMMIT&path=data&per_page=1" --jq '.[0].sha' || true)
            python scripts/site_data.py _site --mode "$mode" --data-commit "$data_commit"
          fi
      - name: Add the Twitch views from the database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RADAR_DEPLOY_LIVE_DATA: ${{ inputs.live_data && '1' || '0' }}
        run: |
          # A commit published by verify_live may predate this step.
          [ -f scripts/site_twitch_views.py ] || { echo "No Twitch views step in this commit."; exit 0; }
          python -m pip install --disable-pip-version-check -q -r requirements-core.txt
          python scripts/site_twitch_views.py _site --mode "$SITE_TWITCH_VIEWS"
          bytes=$(du -sb _site | cut -f1)
          [ "$bytes" -lt 1000000000 ] || { echo "::error::Site is larger than 1 GB"; exit 1; }
      - name: Record the data files this deploy publishes
        env:
          COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          # A commit published by verify_live may predate this step.
          [ -f scripts/live_site_data.py ] || { echo "No data record step in this commit."; exit 0; }
          python scripts/live_site_data.py record _site --commit "$COMMIT"
      - name: Compare every file with the live site
        if: inputs.verify_live
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          set -o pipefail
          python3 scripts/verify_pages_tree.py _site "https://danielet087.github.io/game-trend-radar" --report "$RUNNER_TEMP/report.json"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=1" --jq '.[0].sha')
          : > "$RUNNER_TEMP/changed.txt"
          if [ "$latest" != "$COMMIT" ]; then
            echo "A newer deployment ($latest) went live during the comparison; its changed files are skipped."
            git fetch --quiet --depth=1 origin "$latest"
            git diff --name-only "$COMMIT" "$latest" > "$RUNNER_TEMP/changed.txt"
          fi
          if [ -f _site/site-build.json ]; then
            # The data was rebuilt from the database version this record names;
            # the record itself is derived and not compared.
            echo site-build.json >> "$RUNNER_TEMP/changed.txt"
          fi
          if [ -f _site/site-data.json ]; then
            # Written at build time from the files above, including the views.
            echo site-data.json >> "$RUNNER_TEMP/changed.txt"
          fi
          if [ -f _site/data/publication/twitch_views.json ]; then
            # The moved Twitch views were read from the database at deploy time
            # and change every hour, so they are not compared.
            (cd _site && find data/twitch_history data/twitch_history_compact data/twitch_history_close \
              data/twitch_series -type f 2>/dev/null || true) >> "$RUNNER_TEMP/changed.txt"
          fi
          python3 scripts/verify_pages_tree.py --evaluate "$RUNNER_TEMP/report.json" --skip-list "$RUNNER_TEMP/changed.txt" | tee "$RUNNER_TEMP/summary.json"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: [source, build]
    if: needs.source.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
