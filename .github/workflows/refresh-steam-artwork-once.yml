name: One-time Steam artwork refresh

# One controlled initial wake; switched back to manual-only immediately after
# the run has started. No schedule and no Followers queries.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-steam-artwork-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-artwork-only
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public frontend
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight Steam HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Test safe official artwork URLs offline
        run: python -m unittest discover -s tests -p "test_steam_artwork.py" -v
      - name: Fetch official Steam high-resolution hashed assets in bulk
        run: python -m scripts.refresh_steam_artwork_once --data-dir data
      - name: Confirm only image fields and image timestamps changed
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          allowed = {"header_image", "main_capsule_image"}
          for path in ("data/steam_upcoming.json", "data/steam_preview.json"):
              old = json.loads(subprocess.check_output(
                  ["git", "show", "HEAD:" + path], text=True))
              new = json.loads(Path(path).read_text(encoding="utf-8"))
              assert len(old["games"]) == len(new["games"])
              for before, after in zip(old["games"], new["games"]):
                  assert before["appid"] == after["appid"]
                  assert {k: v for k, v in before.items() if k not in allowed} == {
                      k: v for k, v in after.items() if k not in allowed}
              assert {k:v for k,v in old.items() if k not in ("games", "artwork_refreshed_at", "artwork_provider")} == {
                  k:v for k,v in new.items() if k not in ("games", "artwork_refreshed_at", "artwork_provider")}
              print("VALIDATED", path, "games", len(new["games"]),
                    "headers", sum(bool(g.get("header_image")) for g in new["games"]),
                    "main_capsules", sum(bool(g.get("main_capsule_image")) for g in new["games"]))
          PY
      - name: Publish artwork only, preserve Steam Followers and dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam_upcoming.json data/steam_preview.json
          if git diff --cached --quiet; then
            echo "No Steam image changes"
          else
            git commit -m "data: publish official hashed Steam high-resolution artwork [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
