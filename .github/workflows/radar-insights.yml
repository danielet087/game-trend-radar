name: Record public game activity and growth snapshots
run-name: "Radar insights | slot=${{ inputs.target_slot || 'manual' }} | source=${{ inputs.trigger_source || github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      target_slot:
        description: External scheduler slot identifier (leave empty for a manual run)
        required: false
        type: string
        default: ''
      trigger_source:
        description: Trigger source for run identification
        required: false
        type: string
        default: manual
  push:
    branches: [main]
    paths:
      - 'data/catalog.json'
      - 'data/nintendo_upcoming.json'
      - 'scripts/build_radar_insights.py'
      - 'tests/test_radar_insights.py'
      - 'scripts/sync_scheduler_queue_status.py'
      - 'tests/test_scheduler_queue_sync.py'
      - '.github/workflows/radar-insights.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: radar-insights-publication
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install versioned shared admission rules
        run: python -m pip install --disable-pip-version-check -r requirements-core.txt
      - name: Test observation dates and tracking boundaries
        run: python -m unittest discover -s tests -p test_radar_insights.py
      - name: Test queue backup validation and preservation
        run: python -m unittest discover -s tests -p test_scheduler_queue_sync.py
      - name: Derive current activity without calling Steam
        id: publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_radar_insights.py --observed-at "$observed_at"
            python scripts/sync_scheduler_queue_status.py
            git add data/insights-state.json data/activity.json data/growth.json data/scheduler_queue_status.json
            if git diff --cached --quiet; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m 'data: record public activity, growth and queue status'
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo '::error::Concurrent publication did not settle; existing data was preserved.'
          exit 1
      - name: Request Pages rebuild for the data commit
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
