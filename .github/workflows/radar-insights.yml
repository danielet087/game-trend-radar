name: Record public game activity and growth snapshots
run-name: "Radar insights | slot=${{ inputs.target_slot || 'manual' }} | source=${{ inputs.trigger_source || github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      target_slot:
        description: External scheduler slot identifier (leave empty for a manual run)
        required: false
        type: string
        default: ''
      trigger_source:
        description: Trigger source for run identification
        required: false
        type: string
        default: manual
  push:
    branches: [main]
    paths:
      - 'requirements-core.txt'
      - 'data/catalog.json'
      - 'data/nintendo_upcoming.json'
      - 'data/publication/activity_origins.json'
      - 'scripts/build_radar_insights.py'
      - 'scripts/publish_radar_insights.py'
      - 'tests/test_radar_insights.py'
      - 'scripts/sync_scheduler_queue_status.py'
      - 'tests/test_scheduler_queue_sync.py'
      - '.github/workflows/radar-insights.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: radar-insights-publication
  cancel-in-progress: false

jobs:
  snapshot:
    # Keep the real job/step failures; the notification job owns the email threshold.
    continue-on-error: true
    if: vars.RADAR_DATABASE_MIGRATION_PAUSE != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install versioned shared admission rules
        run: python -m pip install --disable-pip-version-check -r requirements-core.txt
      - name: Test observation dates and tracking boundaries
        run: python -m unittest discover -s tests -p test_radar_insights.py
      - name: Test queue backup validation and preservation
        run: python -m unittest discover -s tests -p test_scheduler_queue_sync.py
      - name: Derive current activity without calling Steam
        id: publish
        env:
          RADAR_DATABASE_PRIMARY: ${{ vars.RADAR_DATABASE_PRIMARY || '0' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          python -m scripts.publish_radar_insights
      - name: Request Pages rebuild for the data commit
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

  notification:
    needs: [snapshot]
    if: always() && !cancelled() && vars.RADAR_DATABASE_MIGRATION_PAUSE != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: danielet087/game-trend-radar-backend/.github/actions/scheduled-failure-notice@202d8a9945c5cb0a2f182a327dd533ac98d8178e
        with:
          workflow-key: radar-insights.yml
          job-name: snapshot
          completion-step: "Derive current activity without calling Steam"
